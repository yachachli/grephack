services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vineflow
      POSTGRES_USER: vineflow
      POSTGRES_PASSWORD: vineflow
    ports:
      - "5432:5432"
    volumes:
      - vineflow_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vineflow -d vineflow"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  vineflow_postgres:
